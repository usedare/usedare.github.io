title: "usdare's Blog"
description: "A personal blog powered by Jekyll and GitHub Pages"
baseurl: ""
url: "https://usdare.github.io"

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/

exclude:
  - Dockerfile
  - docker-compose.yml
  - Gemfile.lock
  - README.md
  - vendor/
